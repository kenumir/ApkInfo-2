apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
//if (getGradle().getStartParameter().getTaskRequests().toString().contains("Hms")) {
//    // nothing
//} else {
//    // nothing for now
//}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.wt.apkinfo"
        minSdkVersion 17
        targetSdkVersion 30
        versionCode 112
        versionName "2.1.2"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    signingConfigs {
        debugKeystore {
            storeFile file("../debug_certificate/debug_cert.jks")
            storePassword "android"
            keyAlias "debug_certificate"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugKeystore
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles  getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro',
                'proguard/proguard-rules.pro',
                'proguard/otto.pro',
                'proguard/retrofit.pro',
                'proguard/okio.pro',
                'proguard/crashlytics.pro',
                'proguard/support_design.pro',
                'proguard/support_v7.pro',
                'proguard/picasso.pro',
                'proguard/android.pro'
        }
        android.applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = outputFileName.replace("app-", "ApkInfo-" + defaultConfig.versionName + "-").replace(".apk", "-[" + defaultConfig.versionCode + "].apk")
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    flavorDimensions "market"

    productFlavors {
        gms {
            buildConfigField "String", "BUILD_FOR_MARKET", "\"google\""
        }
        hms {
            buildConfigField "String", "BUILD_FOR_MARKET", "\"huawei\""
        }
    }
    //compileOptions {
    //    sourceCompatibility = 1.8
    //}


}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    androidTestImplementation 'androidx.multidex:multidex:2.0.1'
    androidTestImplementation 'androidx.multidex:multidex-instrumentation:2.0.0'

    implementation libraries.androidx.core_ktx
    implementation libraries.androidx.appcompat
    implementation libraries.androidx.lifecycle_extensions
    implementation libraries.androidx.fragment
    implementation libraries.androidx.fragment_ktx
    implementation libraries.androidx.recyclerview
    implementation libraries.androidx.constraintlayout

    implementation libraries.android.installreferrer

    implementation libraries.google.material
    implementation libraries.google.firebase.analytics
    implementation libraries.google.firebase.crashlytics

    implementation libraries.squareup.picasso

    implementation libraries.material_dialogs
    implementation libraries.kotlin

    implementation 'com.afollestad.material-dialogs:core:3.3.0'

    implementation project(':module_user_info')

    //hms
    //hmsImplementation 'com.huawei.agconnect:agconnect-core:1.3.1.300'
    //hmsImplementation 'com.huawei.agconnect:agconnect-crash:1.3.1.300'
    hmsImplementation 'com.huawei.hms:hianalytics:4.0.3.300'
}

if (getGradle().getStartParameter().getTaskRequests().toString().contains("Hms")) {
    apply plugin: 'com.huawei.agconnect'
}


