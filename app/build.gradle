plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.bugsnag.android.gradle'
}

android {
    compileSdk versions.compileSdkVersion

    defaultConfig {
        applicationId versions.appId
        minSdkVersion versions.minSdkVersion
        targetSdkVersion versions.targetSdkVersion
        versionCode versions.versionCode
        versionName versions.versionName
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debugKeystore {
            storeFile file("../debug_certificate/debug_cert.jks")
            storePassword "android"
            keyAlias "debug_certificate"
            keyPassword "android"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugKeystore
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles  getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro',
                'proguard/proguard-rules.pro',
                'proguard/okio.pro',
                'proguard/crashlytics.pro',
                'proguard/picasso.pro',
                'proguard/android.pro'
        }
    }

    bugsnag {
        uploadNdkMappings = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // W AGP 9.0+ z wbudowanym Kotlinem, jvmTarget jest zazwyczaj 
    // dziedziczony z compileOptions lub ustawiany w ten sposób:
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    flavorDimensions = ["market"]

    productFlavors {
        gms {
            buildConfigField "String", "BUILD_FOR_MARKET", "\"google\""
        }
        hms {
            buildConfigField "String", "BUILD_FOR_MARKET", "\"huawei\""
        }
        apk {
            buildConfigField "String", "BUILD_FOR_MARKET", "\"apk\""
            versionCode android.defaultConfig.versionCode * 1000
        }
    }

    lint {
        disable 'MissingTranslation', 'NotificationPermission'
    }

    namespace versions.appId
}

dependencies {
    implementation project(':module_user_info')
    implementation project(':app_base')
}

if (getGradle().getStartParameter().getTaskRequests().toString().contains("Hms")) {
    apply plugin: 'com.huawei.agconnect'
}
