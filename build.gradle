// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.72'
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.fabric.io/public' }
        maven { url 'http://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.2.0'
        classpath 'com.huawei.agconnect:agcp:1.2.1.301'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven {url 'http://developer.huawei.com/repo/'}
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext.libraries = [
    kotlin: "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version",
    androidx: [
        appcompat:            'androidx.appcompat:appcompat:1.2.0',
        core_ktx:             'androidx.core:core-ktx:1.3.1',
        lifecycle_extensions: 'androidx.lifecycle:lifecycle-extensions:2.2.0',
        fragment:             'androidx.fragment:fragment:1.2.5',
        fragment_ktx:         'androidx.fragment:fragment-ktx:1.2.5',
        recyclerview:         'androidx.recyclerview:recyclerview:1.1.0',
        constraintlayout:     'androidx.constraintlayout:constraintlayout:1.1.3',
    ],
    android: [
        installreferrer: 'com.android.installreferrer:installreferrer:2.1',
    ],
    google: [
        material:             'com.google.android.material:material:1.2.0',
        firebase: [
            analytics:        'com.google.firebase:firebase-analytics:17.4.4',
            crashlytics:      'com.google.firebase:firebase-crashlytics:17.1.1'
        ],
    ],
    squareup: [
        picasso:              'com.squareup.picasso:picasso:2.5.2', // its small and sufficient
    ],
    material_dialogs:         'com.afollestad.material-dialogs:core:3.3.0'
]