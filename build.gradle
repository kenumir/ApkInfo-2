// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.61'
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.fabric.io/public' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.3'
        classpath 'io.fabric.tools:gradle:1.31.2'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext.libraries = [
    kotlin: "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version",
    androidx: [
        appcompat:            'androidx.appcompat:appcompat:1.1.0',
        core_ktx:             'androidx.core:core-ktx:1.2.0',
        lifecycle_extensions: 'androidx.lifecycle:lifecycle-extensions:2.2.0',
        fragment:             'androidx.fragment:fragment:1.2.2',
        fragment_ktx:         'androidx.fragment:fragment-ktx:1.2.2',
        recyclerview:         'androidx.recyclerview:recyclerview:1.1.0',
        constraintlayout:     'androidx.constraintlayout:constraintlayout:1.1.3',
    ],
    android: [
        installreferrer: 'com.android.installreferrer:installreferrer:1.0',
    ],
    google: [
        material:             'com.google.android.material:material:1.1.0',
        firebase: [
            analytics:        'com.google.firebase:firebase-analytics:17.2.2'
        ],
    ],
    squareup: [
        picasso:              'com.squareup.picasso:picasso:2.5.2', // its small and sufficient
    ],
    material_dialogs:         'com.afollestad.material-dialogs:core:3.3.0',
    crashlytics:              'com.crashlytics.sdk.android:crashlytics:2.10.1'
]