plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace versions.appId
	compileSdk versions.compileSdkVersion

	defaultConfig {
		applicationId versions.appId
		minSdkVersion versions.minSdkVersion
		targetSdkVersion versions.targetSdkVersion
		versionCode versions.versionCode
		versionName versions.versionName + "_tv"
		vectorDrawables.useSupportLibrary = true
		// multidex natywny od API 21+
	}

	signingConfigs {
		debugKeystore {
			storeFile file("../debug_certificate/debug_cert.jks")
			storePassword "android"
			keyAlias "debug_certificate"
			keyPassword "android"
		}
	}

	buildFeatures {
		buildConfig = true
		viewBinding = true
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.debugKeystore
		}
		release {
			shrinkResources true
			minifyEnabled true
			proguardFiles  getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}

	bundle {
		language {
			enableSplit = true
		}
		density {
			enableSplit = true
		}
		abi {
			enableSplit = true
		}
	}

	flavorDimensions = ["market"]

	productFlavors {
		gms {
			buildConfigField "String", "BUILD_FOR_MARKET", "\"google\""
			versionCode android.defaultConfig.versionCode * 10000
		}
		hms {
			buildConfigField "String", "BUILD_FOR_MARKET", "\"huawei\""
			versionCode android.defaultConfig.versionCode * 10000
		}
		apk {
			buildConfigField "String", "BUILD_FOR_MARKET", "\"apk\""
			versionCode android.defaultConfig.versionCode * 1000
		}
	}

	lint {
		disable 'MissingTranslation', 'NotificationPermission'
	}
}

dependencies {
	implementation project(':app_base')
	implementation 'androidx.leanback:leanback:1.2.0'
}