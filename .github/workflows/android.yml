name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy services files
      run: |
        mkdir -p app/src/gms
        mkdir -p app/src/hms
        echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:123","android_client_info":{"package_name":"com.wt.apkinfo"}},"api_key":[{"current_key":"dummy-key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
        echo '{"client":{"cp_id":"dummy","product_id":"dummy","app_id":"dummy"},"service":{"analytics":{"status":0}}}' > app/src/hms/agconnect-services.json

    - name: Run Lint
      run: ./gradlew lint -Pandroid.lintOptions.abortOnError=false

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APKs
      run: ./gradlew assembleDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: debug-apks
        path: "**/build/outputs/apk/debug/*.apk"
